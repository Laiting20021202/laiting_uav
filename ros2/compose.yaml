name: laiting-ros2
services:
  gateway:
    image: laiting-uav-ros2:humble-v1
    build:
      context: ..
      dockerfile: ros2/Dockerfile
    user: "${UAV_UID:-1000}:${UAV_GID:-1000}"
    network_mode: host
    ipc: host
    restart: unless-stopped
    init: true
    stop_grace_period: 180s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 160
    mem_limit: 1400m
    cpus: 2.0
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /app/config/fastdds.xml
      UAV_ROS_CONFIG: /app/config/settings.json
    volumes:
      - ../data/ros2/source:/source:ro
      - ../data/ros2/control:/control
      - ../data/ros2/storage:/data
      - ./config:/app/config:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
